<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="formulir.html" method="get">
        <p>Nama:</p> <input type="text" name="nama" value="nama kamu">
        <br>
        Password: <input type="password" name="password" value="password">
        <br>
        <p>Jenis Kelamin:</p>
        <input type="radio" name="jenis_kelamin" value="Laki laki" checked>
        <p>laki Laki</p>
        <input type="radio" name="jenis_kelamin" value="perempuan" checked>
        <p>perempuan</p>
        <br>
        <p>Hoby:</p>
        <input type="checkbox" name="hoby_membaca" checked> Membaca buku
        <input type="checkbox" name="menulis" checked> Menulis
        <input type="checkbox" name="hoby_memancing" checked> Memancing
        <br>
        <p>Asal Kota:</p>
        <select name="asal_kota">
            <option value="Kota Jakarta">Jakarta</option>
            <option value="Kota Bandung">Bandung</option>
            <option value="Kota Semarang">Semarang</option>
        </select>
        <br>
        <p>Komentar Anda:</p>
        <textarea name="Komentar" rows="5" cols="20">
            Silahkan katakan isi hati anda
        </textarea>
        <br>
        <input type="submit" value="Mulai proses!">
    </form>
</body>
</html>
